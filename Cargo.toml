[package]
name = "agentvfs"
version = "0.1.0"
edition = "2021"
authors = ["Dipankar Sarkar <me@dipankar.name>"]
description = "Virtual filesystem CLI backed by embedded databases for AI agents"
license = "MIT"
repository = "https://github.com/neul-labs/agentvfs"
homepage = "https://github.com/neul-labs/agentvfs"
documentation = "https://docs.rs/agentvfs"
readme = "README.md"
keywords = ["filesystem", "virtual", "cli", "database", "ai-agent"]
categories = ["command-line-utilities", "filesystem", "database"]
exclude = [
    "site/*",
    ".claude/*",
    "target/*",
]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing
sha2 = "0.10"

# Error handling
thiserror = "1"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
dirs = "5"
hex = "0.4"
regex = "1"
glob = "0.3"
tempfile = "3"

# Interactive shell
rustyline = "17"
shlex = "1"

# FUSE filesystem (optional)
fuser = { version = "0.14", optional = true }
libc = { version = "0.2", optional = true }

[features]
default = []
fuse = ["fuser", "libc"]

[dev-dependencies]

[[bin]]
name = "avfs"
path = "src/main.rs"

[lib]
name = "agentvfs"
path = "src/lib.rs"
