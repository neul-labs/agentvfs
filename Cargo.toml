[package]
name = "agentvfs"
version = "0.1.8"
edition = "2021"
authors = ["Neul Labs <contact@neullabs.com>"]
description = "Workspace runtime and execution boundary for AI agents"
license = "MIT"
repository = "https://github.com/neul-labs/agentvfs"
homepage = "https://agentvfs.neullabs.com"
documentation = "https://docs.neullabs.com/agentvfs"
readme = "README.md"
keywords = ["agent", "sandbox", "workspace", "filesystem", "isolation"]
categories = ["command-line-utilities", "filesystem", "database"]
exclude = [
    "site/*",
    ".claude/*",
    "target/*",
]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Sled embedded database (optional)
sled = { version = "0.34", optional = true }

# Full-text search for Sled/LMDB backend (optional)
tantivy = { version = "0.22", optional = true }

# LMDB embedded database (optional)
heed = { version = "0.20", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Memory allocator
mimalloc = { version = "0.1", default-features = false }

# Zero-copy serialization for caching
rkyv = "0.8"

# Thread-safe locks
parking_lot = "0.12"

# Hashing
sha2 = "0.10"

# Error handling
thiserror = "1"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
dirs = "5"
hex = "0.4"
regex = "1"
glob = "0.3"
tempfile = "3"

# Interactive shell
rustyline = "17"
shlex = "1"

# FUSE filesystem (optional)
fuser = { version = "0.14", optional = true }
libc = { version = "0.2" }

[features]
default = []
fuse = ["fuser"]
sled-backend = ["sled", "tantivy"]
lmdb-backend = ["heed", "tantivy"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
assert_fs = "1.1"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"
rand = { version = "0.8", features = ["small_rng"] }
memory-stats = "1.2"

[[bench]]
name = "benchmarks"
harness = false

[[bin]]
name = "avfs"
path = "src/main.rs"

[lib]
name = "agentvfs"
path = "src/lib.rs"
